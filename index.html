<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="MDobe" />
  <link rel="icon" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>MDobe</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header id="toolbar">
    <strong class="brand">MDobe</strong>
    <label class="btn">Abrir<input id="file" type="file" accept="application/pdf" hidden /></label>
    <button id="save" disabled>Guardar</button>
    <span class="sep"></span>
    <button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">+</button>
    <span class="sep"></span>
    <div id="tools">
      <button data-tool="none" class="active" title="Navegar">✋</button>
      <button data-tool="text" title="Texto">T</button>
      <button data-tool="draw" title="Dibujar / firmar">✎</button>
      <button data-tool="highlight" title="Resaltar">▮</button>
      <button data-tool="whiteout" title="Tapar (borrador blanco)">⬜</button>
    </div>
    <input id="color" type="color" value="#d32f2f" title="Color" />
    <button id="undo" title="Deshacer">↶</button>
    <span id="docName"></span>
  </header>
  <main id="viewer"><p class="empty">Abre un PDF o arrástralo aquí.</p></main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
